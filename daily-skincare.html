<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>每日護膚程序</title>
<style>
  :root {
    --ink: #2c2c2b; --muted: #74716d; --paper: #fffdf9; --surface: #ffffff; --line: #e7e4df;
    --yellow: #d4a100; --yellow-bg: #fff8d7;
    --pink: #d86d91; --pink-bg: #fff0f5;
    --purple: #8c6ac7; --purple-bg: #f5efff;
    --green: #4b9b75; --green-bg: #ebf7ef;
    --blue: #4384c8; --blue-bg: #eef6ff;
    --orange: #d5803b; --orange-bg: #fbebde;
    --red: #d95c59; --red-bg: #fff0ef;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--paper); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; font-size: 16px; line-height: 1.45; }
  button { font: inherit; }
  .app { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  .eyebrow { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pink); }
  h1 { margin: 10px 0 6px; font-size: 34px; letter-spacing: -.04em; line-height: 1.1; }
  .subtitle { margin: 0; color: var(--muted); }
  .controls { margin: 24px 0; padding: 16px; background: rgba(255,255,255,.78); border: 1px solid var(--line); border-radius: 14px; }
  .control-row + .control-row { margin-top: 16px; padding-top: 16px; border-top: 1px solid #efedea; }
  .control-label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 9px; }
  .button-group { display: flex; flex-wrap: wrap; gap: 8px; }
  #dayButtons { flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; padding: 2px 2px 10px; margin: 0 -2px; scrollbar-width: thin; }
  .day-choice { flex: 0 0 102px; min-height: 76px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 7px; padding: 12px; scroll-snap-align: start; }
  .day-name { font-size: 16px; font-weight: 800; }
  .day-badge { display: inline-flex; align-items: center; border-radius: 5px; padding: 3px 6px; font-size: 11px; font-weight: 800; line-height: 1; }
  .day-badge.purple { color: #65479a; background: #e8ddfa; }
  .day-badge.green { color: #236747; background: #d6f1df; }
  .choice { min-height: 42px; border-radius: 9px; padding: 8px 13px; background: #fff; border: 1px solid #ddd9d5; color: var(--ink); cursor: pointer; transition: .16s ease; }
  .choice.has-help { min-height: 58px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; }
  .choice-help { font-size: 11px; font-weight: 500; color: var(--muted); }
  .choice.active .choice-help { color: rgba(255,255,255,.72); }
  .choice:hover { border-color: #aaa39b; transform: translateY(-1px); }
  .choice:focus-visible { outline: 3px solid #b9d8f8; outline-offset: 2px; }
  .choice.active { color: #fff; background: var(--ink); border-color: var(--ink); font-weight: 700; }
  .day-row[hidden] { display: none; }
  .today-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 28px 0 14px; }
  .today-title { margin: 0; font-size: 24px; letter-spacing: -.025em; }
  .routine-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .routine-chip { appearance: none; flex: 1 1 0; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1.5px solid; border-radius: 9px; padding: 8px 11px; font-size: 15px; font-weight: 800; white-space: nowrap; cursor: pointer; }
  .routine-chip:hover { transform: translateY(-1px); filter: brightness(.98); }
  .routine-chip:focus-visible { outline: 3px solid #b9d8f8; outline-offset: 2px; }
  .routine-chip .time { font-size: 13px; opacity: .76; }
  .routine-chip.yellow { color: #876500; background: var(--yellow-bg); border-color: var(--yellow); }
  .routine-chip.pink { color: #ad4268; background: var(--pink-bg); border-color: var(--pink); }
  .routine-chip.purple { color: #694b9f; background: var(--purple-bg); border-color: var(--purple); }
  .routine-chip.green { color: #2f724f; background: var(--green-bg); border-color: var(--green); }
  .routine-chip.red { color: #aa3936; background: var(--red-bg); border-color: var(--red); }
  .routine { display: grid; grid-template-columns: 1fr; gap: 14px; }
  #scheduledRoutine { display: contents; }
  #scheduledRoutine[hidden] { display: none; }
  .time-panel { padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .night-panel { background: #191919; border-color: #191919; }
  .night-panel .time-heading { color: #fff; }
  .night-panel .time-icon { background: #383836; }
  .time-heading { display: flex; align-items: center; gap: 9px; margin: 0 0 16px; font-size: 18px; }
  .time-icon { width: 30px; height: 30px; display: grid; place-items: center; background: #f5f3f0; border-radius: 8px; }
  .groups { display: grid; gap: 12px; }
  .group { border: 2px solid; border-radius: 12px; padding: 12px; }
  .group.yellow { border-color: var(--yellow); background: linear-gradient(135deg, var(--yellow-bg), #fff 72%); }
  .group.pink { border-color: var(--pink); background: linear-gradient(135deg, var(--pink-bg), #fff 72%); }
  .group.purple { border-color: var(--purple); background: linear-gradient(135deg, var(--purple-bg), #fff 72%); }
  .group.green { border-color: var(--green); background: linear-gradient(135deg, var(--green-bg), #fff 72%); }
  .group.blue { border-color: var(--blue); background: linear-gradient(135deg, var(--blue-bg), #fff 72%); }
  .group.orange { border-color: var(--orange); background: linear-gradient(135deg, var(--orange-bg), #fff 72%); }
  .group.red { border-color: var(--red); background: linear-gradient(135deg, var(--red-bg), #fff 72%); }
  .group-label { display: flex; align-items: center; gap: 7px; margin: 0 0 9px; font-size: 13px; font-weight: 800; }
  .group-label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .yellow .group-label { color: #967000; } .pink .group-label { color: #b94f76; } .purple .group-label { color: #7250ab; } .green .group-label { color: #367a58; } .blue .group-label { color: #2d6ead; } .orange .group-label { color: #a85d20; } .red .group-label { color: #b74340; }
  .product-list { display: grid; gap: 8px; }
  .card { position: relative; min-height: 72px; padding: 12px 12px 10px; border: 1px solid rgba(72,67,61,.15); border-radius: 9px; background: rgba(255,255,255,.92); box-shadow: 0 1px 2px rgba(0,0,0,.035); }
  .card-name { font-weight: 700; padding-right: 4px; max-width: 64%; }
  .card-note { margin-top: 4px; color: var(--muted); font-size: 13px; }
  .badges { position: absolute; top: 9px; right: 9px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 47%; }
  .badge { padding: 3px 6px; border-radius: 5px; font-size: 11px; line-height: 1.15; white-space: nowrap; font-weight: 750; }
  .badge.yellow { color: #7d5e00; background: #fff0a8; } .badge.pink { color: #a63d61; background: #ffdce8; } .badge.purple { color: #65479a; background: #e8ddfa; } .badge.green { color: #236747; background: #d6f1df; } .badge.blue { color: #215f9c; background: #dceeff; } .badge.orange { color: #9c561f; background: #f9dfc9; } .badge.red { color: #aa3936; background: #ffdedd; }
  .notice { margin: 18px 0 0; padding: 12px 14px; background: #f8f6f3; border-left: 3px solid #b8b2aa; border-radius: 0 8px 8px 0; color: #5e5a55; font-size: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 22px; color: var(--muted); font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 6px; } .legend-swatch { width: 12px; height: 12px; border-radius: 4px; border: 2px solid; }
  .today-header { align-items: flex-start; flex-direction: column; gap: 12px; }
  .choice { flex: 1 0 auto; }
  .choice.has-help { flex: 1 1 145px; }
</style>
</head>
<body>
<main class="app">
  <div class="eyebrow"><span class="dot"></span>你的保養選擇器</div>
  <h1>今天，用這些就好。</h1>
  <p class="subtitle">選擇肌膚狀態與星期，依功效精華 → 保濕屏障 → 眼周的順序顯示。</p>

  <section class="controls" aria-label="保養模式選擇">
    <div class="control-row">
      <span class="control-label">1｜目前狀態</span>
      <div class="button-group" id="modeButtons">
        <button class="choice active" data-mode="normal">平常日</button>
        <button class="choice has-help" data-mode="recovery"><span>回穩期</span><span class="choice-help">醫美前一週/兩週後</span></button>
        <button class="choice has-help" data-mode="acute"><span>急性期</span><span class="choice-help">醫美後一週</span></button>
      </div>
    </div>
    <div class="control-row day-row" id="dayRow">
      <span class="control-label">2｜今天星期幾</span>
      <div class="button-group" id="dayButtons">
        <button class="choice day-choice active" data-day="mon"><span class="day-name">週一</span><span class="day-badge purple">抗老</span></button>
        <button class="choice day-choice" data-day="tue"><span class="day-name">週二</span><span class="day-badge green">煥膚</span></button>
        <button class="choice day-choice" data-day="wed"><span class="day-name">週三</span><span class="day-badge purple">抗老</span></button>
        <button class="choice day-choice" data-day="thu"><span class="day-name">週四</span></button>
        <button class="choice day-choice" data-day="fri"><span class="day-name">週五</span><span class="day-badge purple">抗老</span></button>
        <button class="choice day-choice" data-day="sat"><span class="day-name">週六</span><span class="day-badge green">煥膚</span></button>
        <button class="choice day-choice" data-day="sun"><span class="day-name">週日</span></button>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">3｜加強需求</span>
      <div class="button-group" id="boostButtons">
        <button class="choice" data-boost="whitening">美白</button>
        <button class="choice" data-boost="exfoliate">煥膚</button>
        <button class="choice" data-boost="anti">抗老</button>
        <button class="choice" data-boost="repair">修護</button>
      </div>
    </div>
  </section>

  <div class="today-header"><h2 class="today-title" id="routineTitle">平常日・週一</h2><div class="routine-chips" id="routineChips" aria-label="早晚主要功效"></div></div>
  <section class="routine" aria-live="polite">
    <div id="scheduledRoutine">
      <article class="time-panel" id="morningPanel" tabindex="-1"><h3 class="time-heading"><span class="time-icon">☀️</span>早上</h3><div class="groups" id="morning"></div></article>
      <article class="time-panel night-panel" id="eveningPanel" tabindex="-1"><h3 class="time-heading"><span class="time-icon">🌙</span>晚上</h3><div class="groups" id="evening"></div></article>
    </div>
    <article class="time-panel" id="boostPanel" tabindex="-1" hidden><h3 class="time-heading"><span class="time-icon">⚡</span>加強需求</h3><div class="groups" id="boostRoutine"></div></article>
  </section>
  <p class="notice" id="notice"></p>
  <div class="legend" aria-label="功效色彩說明">
    <span class="legend-item"><i class="legend-swatch" style="border-color:var(--yellow);background:var(--yellow-bg)"></i>美白</span><span class="legend-item"><i class="legend-swatch" style="border-color:var(--pink);background:var(--pink-bg)"></i>修護</span><span class="legend-item"><i class="legend-swatch" style="border-color:var(--purple);background:var(--purple-bg)"></i>抗老</span><span class="legend-item"><i class="legend-swatch" style="border-color:var(--green);background:var(--green-bg)"></i>煥膚</span><span class="legend-item"><i class="legend-swatch" style="border-color:var(--blue);background:var(--blue-bg)"></i>保濕屏障</span><span class="legend-item"><i class="legend-swatch" style="border-color:var(--orange);background:var(--orange-bg)"></i>眼周</span><span class="legend-item"><i class="legend-swatch" style="border-color:var(--red);background:var(--red-bg)"></i>泛紅修護</span>
  </div>
</main>
<script>
const p = {
 whitening: {name:'達特醫三重美白精華', badges:['維生素','乙基維生素 C','傳明酸'], type:'yellow'},
 soothing: {name:'達特醫三重舒緩精華', badges:['積雪草'], type:'pink'},
 b5: {name:'理膚寶水 B5 修護霜', badges:['維他命 B5'], type:'red'},
 retinol: {name:'達特醫 A 醇藍標 0.2% 精華', badges:['A 醇'], type:'purple'},
 peptide: {name:'達特醫六胜肽精華', badges:['六胜肽'], type:'purple'},
 liftingCream: {name:'3D無痕透白微整拉提霜', badges:[{name:'水楊酸（粉刺）', type:'green'},{name:'傳明酸（Ｘ黑色素）', type:'yellow'},{name:'B3 菸鹼醯胺（暗沉）', type:'blue'}], type:'green', note:'使用範圍：T 字部位｜霜狀後上'},
 mandelic: {name:'達特醫淡斑植萃美白凝膠', badges:['杏仁酸'], type:'green', note:'使用範圍：斑��局部'},
 ceramide: {name:'達特醫神經醯胺精華', badges:['神經醯胺'], type:'blue'},
 hyaluronic: {name:'Timeless 高保濕玻尿酸精華液', badges:['玻尿酸'], type:'blue'},
 niacinamide: {name:'達特醫 B3 菸鹼醯胺精華', badges:['B3 菸鹼醯胺'], type:'blue'},
 eyePaula: {name:'寶拉高效胜肽膠原緊緻眼部精華', badges:[{name:'胜肽（動態紋）',type:'purple'},{name:'角鯊烷',type:'blue'}], type:'orange'},
 eyeEGF: {name:'達特醫 EGF 複合胜肽緊緻眼霜', badges:[{name:'A 醇（靜態紋）',type:'purple'},{name:'胜肽（動態紋）',type:'purple'}], type:'orange'}
};
const groupMeta = {yellow:'美白', pink:'修護', purple:'抗老', green:'煥膚', blue:'保濕屏障', orange:'眼周', red:'泛紅修護'};
const sets = {
 morningNormal: [ ['yellow',[p.whitening]], ['purple',[p.peptide]], ['blue',[p.hyaluronic,p.ceramide]], ['orange',[p.eyePaula]] ],
 anti: [ ['purple',[p.retinol,p.peptide]], ['blue',[p.niacinamide,p.ceramide]], ['orange',[p.eyeEGF]] ],
 exfoliate: [ ['green',[p.liftingCream,p.mandelic]], ['blue',[p.niacinamide,p.ceramide]], ['orange',[p.eyePaula]] ],
 repair: [ ['pink',[p.soothing]], ['blue',[p.hyaluronic,p.niacinamide,p.ceramide]], ['orange',[p.eyeEGF]], ['red',[p.b5]] ],
 recoveryRepair: [ ['pink',[p.soothing]], ['blue',[p.hyaluronic,p.niacinamide,p.ceramide]], ['orange',[p.eyePaula]], ['red',[p.b5]] ],
 acuteRepair: [ ['pink',[p.soothing]], ['blue',[p.hyaluronic,p.ceramide]], ['orange',[p.eyePaula]], ['red',[p.b5]] ],
 boostWhitening: [ ['yellow',[p.whitening]], ['blue',[p.hyaluronic,p.ceramide]] ],
 boostExfoliate: [ ['green',[p.liftingCream,p.mandelic]], ['blue',[p.niacinamide,p.ceramide]] ],
 boostAnti: [ ['purple',[p.retinol,p.peptide]], ['blue',[p.niacinamide,p.ceramide]] ],
 boostRepair: [ ['pink',[p.soothing]], ['blue',[p.hyaluronic,p.niacinamide,p.ceramide]], ['red',[p.b5]] ]
};
const days = {mon:['週一','anti','美白＋抗老'],tue:['週二','exfoliate','美白＋煥膚'],wed:['週三','anti','美白＋抗老'],thu:['週四','repair','美白＋修護'],fri:['週五','anti','美白＋抗老'],sat:['週六','exfoliate','美白＋煥膚'],sun:['週日','repair','美白＋修護']};
let mode='normal', day='mon', boost=null;
function card(item){ return `<div class="card"><div class="card-name">${item.name}</div><div class="badges">${item.badges.map(b=>{ const badge=typeof b==='string'?{name:b,type:item.type}:b; return `<span class="badge ${badge.type}">${badge.name}</span>`; }).join('')}</div>${item.note?`<div class="card-note">${item.note}</div>`:''}</div>`; }
function renderGroups(groups){ return groups.map(([type,items])=>`<section class="group ${type}"><h4 class="group-label">${groupMeta[type]}</h4><div class="product-list">${items.map(card).join('')}</div></section>`).join(''); }
function renderRoutineChips(chips){ return chips.map(chip=>`<button type="button" class="routine-chip ${chip.type}" data-scroll-target="${chip.time==='早'?'morningPanel':'eveningPanel'}"><span class="time">${chip.time}</span><span>${chip.label}</span></button>`).join(''); }
function render(){
 const dayInfo=days[day]; let morning, evening, title, chips, note;
 const scheduled=document.getElementById('scheduledRoutine'), boostPanel=document.getElementById('boostPanel');
 if(boost) {
   const boostConfig={whitening:['美白','yellow','boostWhitening'],exfoliate:['煥膚','green','boostExfoliate'],anti:['抗老','purple','boostAnti'],repair:['修護','pink','boostRepair']}[boost];
   title=`加強需求・${boostConfig[0]}`; chips=[{time:'快速',label:boostConfig[0],type:boostConfig[1]}]; note='快速查看單一功效流程；完成主要功效後，接續保濕屏障。';
   document.getElementById('boostRoutine').innerHTML=renderGroups(sets[boostConfig[2]]); scheduled.hidden=true; boostPanel.hidden=false;
 } else {
   if(mode==='normal') { morning=sets.morningNormal; evening=sets[dayInfo[1]]; title=`平常日・${dayInfo[0]}`; chips=[{time:'早',label:'美白',type:'yellow'},{time:'晚',label:dayInfo[1]==='anti'?'抗老':dayInfo[1]==='exfoliate'?'煥膚':'修護',type:dayInfo[1]==='anti'?'purple':dayInfo[1]==='exfoliate'?'green':'pink'}]; note=dayInfo[1]==='exfoliate'?'煥膚提醒：3D 無痕透白微整拉提霜只擦 T 字；杏仁酸只擦斑點。若斑點位於 T 字部位，依肌膚耐受狀況調整局部使用。':'平常日提醒：依卡片由上到下使用，功效精華完成後再進入保濕屏障。'; }
   if(mode==='recovery') { morning=sets.morningNormal; evening=sets.recoveryRepair; title='回穩期'; chips=[{time:'早',label:'美白',type:'yellow'},{time:'晚',label:'修護',type:'pink'}]; note=''; }
   if(mode==='acute') { morning=sets.acuteRepair; evening=sets.acuteRepair; title='急性期'; chips=[{time:'早',label:'修護',type:'pink'},{time:'晚',label:'修護',type:'pink'}]; note=''; }
   document.getElementById('morning').innerHTML=renderGroups(morning); document.getElementById('evening').innerHTML=renderGroups(evening); scheduled.hidden=false; boostPanel.hidden=true;
 }
 document.getElementById('routineTitle').textContent=title; document.getElementById('routineChips').innerHTML=renderRoutineChips(chips); const noticeEl=document.getElementById('notice'); noticeEl.textContent=note; noticeEl.hidden=!note; document.getElementById('dayRow').hidden=boost || mode!=='normal';
}
function setActive(container, selector, value, attr){ container.querySelectorAll(selector).forEach(el=>el.classList.toggle('active',el.dataset[attr]===value)); }
function clearBoost(){ boost=null; document.querySelectorAll('#boostButtons .choice').forEach(el=>el.classList.remove('active')); }
document.getElementById('modeButtons').addEventListener('click',e=>{const button=e.target.closest('[data-mode]'); if(!button)return; clearBoost(); mode=button.dataset.mode; setActive(e.currentTarget,'.choice',mode,'mode'); render();});
document.getElementById('dayButtons').addEventListener('click',e=>{const button=e.target.closest('[data-day]'); if(!button)return; clearBoost(); mode='normal'; setActive(document.getElementById('modeButtons'),'.choice',mode,'mode'); day=button.dataset.day; setActive(e.currentTarget,'.choice',day,'day'); render();});
document.getElementById('boostButtons').addEventListener('click',e=>{const button=e.target.closest('[data-boost]'); if(!button)return; boost=button.dataset.boost; document.querySelectorAll('#modeButtons .choice, #dayButtons .choice').forEach(el=>el.classList.remove('active')); setActive(e.currentTarget,'.choice',boost,'boost'); render();});
document.getElementById('routineChips').addEventListener('click',e=>{const button=e.target.closest('[data-scroll-target]'); if(!button)return; document.getElementById(button.dataset.scrollTarget)?.scrollIntoView({behavior:'smooth', block:'start'});});
render();
</script>
</body>
</html>
